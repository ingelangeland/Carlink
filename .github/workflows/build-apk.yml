# Bygger begge appene (CarLink til bilskjermen og CarLink Sender til telefonen) automatisk.
# Resultatet legges ut som en «Release» med navnet «Siste versjon», der APK-filene kan lastes ned direkte.
name: Bygg APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Prosjektet kan lastes opp som én fil (CarLink.zip). Den pakkes ut her.
      - name: Pakk ut CarLink.zip
        run: |
          ZIP=$(ls -t CarLink*.zip 2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then
            echo "Pakker ut $ZIP"
            unzip -q -o "$ZIP" -d /tmp/prosjekt
            cp -r /tmp/prosjekt/CarLink/. .
          fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Godta Android-lisenser
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Bygg appene
        run: gradle :launcher:assembleDebug :sender:assembleDebug --stacktrace

      - name: Gi filene tydelige navn
        run: |
          mkdir -p ut
          cp launcher/build/outputs/apk/debug/launcher-debug.apk ut/CarLink-bilskjerm.apk
          cp sender/build/outputs/apk/debug/sender-debug.apk ut/CarLink-Sender-telefon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarLink-APK
          path: ut/*.apk

      - name: Legg ut som nedlastbar versjon
        uses: softprops/action-gh-release@v2
        with:
          tag_name: siste
          name: Siste versjon
          prerelease: false
          make_latest: true
          files: ut/*.apk
          body: |
            **CarLink-bilskjerm.apk** – installeres på skjermen i bilen.
            **CarLink-Sender-telefon.apk** – installeres på telefonen.
