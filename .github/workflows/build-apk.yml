# Bygger begge appene (optimalisert «release»), legger dem ut som «Siste versjon»,
# og kjører deretter en simulering i Android-emulator med skjermbilder og ytelsesmåling.
name: Bygg APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pakk ut CarLink.zip (hvis lastet opp som zip)
        run: |
          ZIP=$(ls -t CarLink*.zip 2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then
            unzip -q -o "$ZIP" -d /tmp/prosjekt
            cp -r /tmp/prosjekt/CarLink/. .
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Godta Android-lisenser
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Bygg appene (optimalisert)
        run: gradle :launcher:assembleRelease :sender:assembleRelease --stacktrace

      - name: Gi filene tydelige navn
        run: |
          mkdir -p ut
          cp launcher/build/outputs/apk/release/launcher-release.apk ut/CarLink-bilskjerm.apk
          cp sender/build/outputs/apk/release/sender-release.apk ut/CarLink-Sender-telefon.apk
          ls -l ut

      - uses: actions/upload-artifact@v4
        with:
          name: CarLink-APK
          path: ut/*.apk

      - name: Legg ut som nedlastbar versjon
        uses: softprops/action-gh-release@v2
        with:
          tag_name: siste
          name: Siste versjon
          prerelease: false
          make_latest: true
          files: ut/*.apk
          body: |
            CarLink-bilskjerm.apk – installeres på skjermen i bilen.
            CarLink-Sender-telefon.apk – installeres på telefonen.

  simulate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sim: "16x9", skin: "1920x1080", gpu: "swiftshader_indirect", tag: "-alt",          extra: "" }
          - { sim: "16x9", skin: "1920x1080", gpu: "swiftshader_indirect", tag: "-uten-bolger", extra: "--ez noviz true" }
          - { sim: "16x9", skin: "1920x1080", gpu: "swiftshader_indirect", tag: "-uten-cover",  extra: "--ez noart true" }
          - { sim: "21x9", skin: "1920x824",  gpu: "guest",                tag: "-gpu-guest",   extra: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: CarLink-APK
          path: ut

      - name: Slå på maskinvareakselerasjon for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Kjør simulering (${{ matrix.sim }}${{ matrix.tag }})
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SIM: ${{ matrix.sim }}
          TAG: ${{ matrix.tag }}
          EXTRA: ${{ matrix.extra }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio -no-boot-anim -skin ${{ matrix.skin }}
          script: bash tools/simulate.sh

      - name: Rydd bort tomme filer
        if: always()
        run: find sim -type f -empty -delete 2>/dev/null; ls -la sim || true

      - name: Legg ut simuleringsresultat
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: simulering
          name: Simulering (skjermbilder og rapport)
          prerelease: true
          make_latest: false
          files: |
            sim/*.png
            sim/RAPPORT-*.txt
            sim/KRASJ-*.txt
            sim/EMULATOR-*.txt
            sim/LOGG-SISTE-*.txt

      - name: Feil hvis appen krasjet
        run: test -z "$(ls sim/KRASJ-*.txt 2>/dev/null)"
