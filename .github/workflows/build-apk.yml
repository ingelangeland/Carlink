# Bygger begge appene (optimalisert «release»), legger dem ut som «Siste versjon»,
# og kjører deretter en simulering i Android-emulator med skjermbilder og ytelsesmåling.
name: Bygg APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pakk ut CarLink.zip (hvis lastet opp som zip)
        run: |
          ZIP=$(ls -t CarLink*.zip 2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then
            unzip -q -o "$ZIP" -d /tmp/prosjekt
            cp -r /tmp/prosjekt/CarLink/. .
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Godta Android-lisenser
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Bygg appene (optimalisert)
        run: gradle :launcher:assembleRelease :sender:assembleRelease --stacktrace

      - name: Gi filene tydelige navn
        run: |
          mkdir -p ut
          cp launcher/build/outputs/apk/release/launcher-release.apk ut/CarLink-bilskjerm.apk
          cp sender/build/outputs/apk/release/sender-release.apk ut/CarLink-Sender-telefon.apk
          # Version info for the built-in updater in both apps
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"versionName\": \"1.0.${GITHUB_RUN_NUMBER}\"}" > ut/version.json
          ls -l ut

      - uses: actions/upload-artifact@v4
        with:
          name: CarLink-APK
          path: ut/*.apk

      - name: Legg ut som nedlastbar versjon
        uses: softprops/action-gh-release@v2
        with:
          tag_name: siste
          name: Latest version
          prerelease: false
          make_latest: true
          files: |
            ut/*.apk
            ut/version.json
          body: |
            CarLink-bilskjerm.apk – install on the car screen.
            CarLink-Sender-telefon.apk – install on the phone.
            Both apps update themselves after this (Settings → Updates).

  # Kodekontroll (Android Lint) parallelt, så det ikke forsinker bygg og simulering
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Godta Android-lisenser
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Kjør Lint
        run: |
          set +e
          mkdir -p lint
          gradle :launcher:lintRelease :sender:lintRelease --continue > lint/LINT-gradle.txt 2>&1
          cp launcher/build/lint.txt lint/LINT-bilskjerm.txt || echo "ingen rapport" > lint/LINT-bilskjerm.txt
          cp sender/build/lint.txt lint/LINT-telefon.txt || echo "ingen rapport" > lint/LINT-telefon.txt
          tail -c 20000 lint/LINT-gradle.txt > lint/LINT-gradle-slutt.txt
          rm lint/LINT-gradle.txt
          exit 0
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: simulering
          files: lint/*.txt

  simulate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bilskjermen: 1920x720 med to vanlige tettheter, og telefonen (S24 Ultra-lik)
          - { sim: "bil-240dpi", skin: "1920x720",  dens: "240", gpu: "swiftshader_indirect", tag: "", extra: "" }
          - { sim: "bil-160dpi", skin: "1920x720",  dens: "160", gpu: "swiftshader_indirect", tag: "", extra: "" }
          # Older car head units: Android 7.0 (API 24)
          - { sim: "bil-android7", skin: "1920x720", dens: "160", gpu: "swiftshader_indirect", tag: "", extra: "", api: 24 }
          - { sim: "telefon",    skin: "1080x2340", dens: "450", gpu: "swiftshader_indirect", tag: "", extra: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: CarLink-APK
          path: ut

      - name: Slå på maskinvareakselerasjon for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Kjør simulering (${{ matrix.sim }}${{ matrix.tag }})
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SIM: ${{ matrix.sim }}
          DENS: ${{ matrix.dens }}
          TAG: ${{ matrix.tag }}
          EXTRA: ${{ matrix.extra }}
        with:
          api-level: ${{ matrix.api || 34 }}
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio -no-boot-anim -skin ${{ matrix.skin }}
          script: bash tools/simulate.sh

      - name: Rydd bort tomme filer
        if: always()
        run: find sim -type f -empty -delete 2>/dev/null; ls -la sim || true

      - name: Legg ut simuleringsresultat
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: simulering
          name: Simulering (skjermbilder og rapport)
          prerelease: true
          make_latest: false
          files: |
            sim/*.png
            sim/RAPPORT-*.txt
            sim/KRASJ-*.txt
            sim/EMULATOR-*.txt
            sim/LOGG-SISTE-*.txt

      - name: Feil hvis appen krasjet
        run: test -z "$(ls sim/KRASJ-*.txt 2>/dev/null)"
